name: Build and test pull requests

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

jobs:
    build-and-test:
        name: Build and run unit tests
        runs-on: ubuntu-latest
        
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: '10.0.x'

            - name: Restore dependencies
              run: dotnet restore ThrottleX.sln

            - name: Build solution
              run: dotnet build ThrottleX.sln --configuration Release --no-restore

            - name: Run unit tests
              run: dotnet test test/Unittests/Unittests.csproj --configuration Release --no-restore --verbosity normal
