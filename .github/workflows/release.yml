name: Build and Release Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.6 or v0.6). Leave empty to auto-increment version.txt'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debian Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test --configuration Release

      - name: Build Debian Package
        id: build_package
        run: |
          chmod +x ./build-package.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            ./build-package.sh "${{ github.event.inputs.version }}"
            RELEASE_TAG="v$(cat version.txt)"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            ./build-package.sh "${{ github.ref_name }}"
            RELEASE_TAG="${{ github.ref_name }}"
          else
            ./build-package.sh
            RELEASE_TAG="v$(cat version.txt)"
          fi
          
          VERSION=$(cat version.txt)
          DEB_FILE=$(ls throttle-x-*.deb | head -n 1)
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_file=${DEB_FILE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Update version.txt in repository
        run: |
          VERSION="${{ steps.build_package.outputs.version }}"
          if [ "${{ github.ref_type }}" = "branch" ]; then
            TARGET_BRANCH="${{ github.ref_name }}"
          else
            TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          fi
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="develop"
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          
          echo "${VERSION}" > version.txt
          
          if ! git diff --quiet version.txt; then
            git add version.txt
            git commit -m "Update version.txt to ${VERSION} [skip ci]"
            git push origin "${TARGET_BRANCH}"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.build_package.outputs.release_tag }}"
          DEB_FILE="${{ steps.build_package.outputs.deb_file }}"
          gh release create "${RELEASE_TAG}" "${DEB_FILE}" \
            --title "Release ${RELEASE_TAG}" \
            --generate-notes
