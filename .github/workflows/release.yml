name: Build and Release Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debian Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ThrottleX.sln

      - name: Build solution
        run: dotnet build ThrottleX.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release

      - name: Update version.txt in repository
        id: update_version
        run: |
          RAW_VERSION="${{ github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          RELEASE_TAG="${{ github.ref_name }}"
          
          TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="develop"
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          
          echo "${VERSION}" > version.txt
          
          if ! git diff --quiet version.txt; then
            git add version.txt
            git commit -m "Update version.txt to ${VERSION} [skip ci]"
            git push origin "${TARGET_BRANCH}"
          fi
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Debian Package
        id: build_package
        run: |
          chmod +x ./build-package.sh
          ./build-package.sh "${{ steps.update_version.outputs.version }}"
          
          DEB_FILE=$(ls throttle-x-*.deb | head -n 1)
          echo "deb_file=${DEB_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            set -euo pipefail
            
            RELEASE_TAG="${{ steps.update_version.outputs.release_tag }}"
            DEB_FILE="${{ steps.build_package.outputs.deb_file }}"
            
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; uploading package"
              gh release upload "$RELEASE_TAG" "$DEB_FILE" --clobber
            else
              gh release create "$RELEASE_TAG" "$DEB_FILE" \
                --title "Release ${RELEASE_TAG}" \
                --generate-notes
            fi
