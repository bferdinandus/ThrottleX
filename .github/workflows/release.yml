name: Build and Release Package

on:
    push:
        tags:
            - 'v*'
            - '[0-9]*'

permissions:
    contents: write
    pull-requests: write

jobs:
    build-and-release:
        name: Build Debian Package & Release
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup .NET SDK
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: '10.0.x'

            -   name: Restore dependencies
                run: dotnet restore ThrottleX.sln

            -   name: Build solution
                run: dotnet build ThrottleX.sln --configuration Release --no-restore

            -   name: Run Tests
                run: dotnet test --configuration Release

            -   name: Extract Version Info
                id: version_info
                run: |
                    RAW_VERSION="${{ github.ref_name }}"
                    VERSION=$(echo "${RAW_VERSION}" | sed 's/^v//')
                    echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "release_tag=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

            -   name: Build Debian Package
                id: build_package
                run: |
                    chmod +x ./build-package.sh
                    ./build-package.sh "${{ steps.version_info.outputs.version }}"
                    
                    DEB_FILE=$(ls throttle-x-*.deb | head -n 1)
                    echo "deb_file=${DEB_FILE}" >> "$GITHUB_OUTPUT"

            -   name: Publish GitHub Release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    set -euo pipefail
                    
                    RELEASE_TAG="${{ steps.version_info.outputs.release_tag }}"
                    DEB_FILE="${{ steps.build_package.outputs.deb_file }}"
                    
                    if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      echo "Release $RELEASE_TAG already exists; uploading package"
                      gh release upload "$RELEASE_TAG" "$DEB_FILE" --clobber
                    else
                      gh release create "$RELEASE_TAG" "$DEB_FILE" \
                        --title "Release ${RELEASE_TAG}" \
                        --generate-notes
                    fi

            -   name: Create Pull Request to update version.txt
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    VERSION="${{ steps.version_info.outputs.version }}"
                    TARGET_BRANCH="${{ github.event.repository.default_branch }}"
                    [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="develop"
                    
                    BRANCH_NAME="release/v${VERSION}"
                    
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    
                    # Fetch and checkout default branch
                    git fetch origin "${TARGET_BRANCH}"
                    git checkout -B "${BRANCH_NAME}" "origin/${TARGET_BRANCH}"
                    
                    # Update version file
                    echo "${VERSION}" > version.txt
                    
                    # Commit and push if changed
                    if ! git diff --quiet version.txt; then
                      git add version.txt
                      git commit -m "release: update version.txt to ${VERSION} [skip ci]"
                      git push origin "${BRANCH_NAME}" --force
                    
                      # Create Pull Request if one doesn't exist
                      if ! gh pr list --head "${BRANCH_NAME}" --base "${TARGET_BRANCH}" --json number -q '.[0].number' | grep -q '^[0-9]'; then
                        gh pr create \
                          --base "${TARGET_BRANCH}" \
                          --head "${BRANCH_NAME}" \
                          --title "release: update version.txt to ${VERSION}" \
                          --body "Automated version bump for release \`${{ steps.version_info.outputs.release_tag }}\`."
                      fi
                      
                      gh pr merge "${BRANCH_NAME}" --auto --squash
                    fi
